<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>:root{--color-bg:#0F1012;--color-text:#F2F2F0;--color-text-muted:#9C9C9A;--color-border:rgba(255,255,255,0.16);--color-accent:#A6D43A;--font-en:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif}</style></helmet>
<header style="height:80px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text)">
  <a href="#" style="display:flex;align-items:center;gap:8px;font:400 18px/1 var(--font-en);color:var(--color-text);text-decoration:none">yuyadesign<span style="width:6px;height:6px;border-radius:50%;background:var(--color-accent)"></span></a>
  <nav style="display:flex;gap:32px;font:400 13px/1 var(--font-en);letter-spacing:.12em">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <a href="#" aria-current="{{ it.current }}" style="padding-bottom:4px;color:var(--color-text);text-decoration:none;border-bottom:1px solid {{ it.line }}">{{ it.label }}</a>
    </sc-for>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;HOME&quot;,&quot;ABOUT&quot;,&quot;SERVICES&quot;,&quot;BLOG&quot;,&quot;CONTACT&quot;],&quot;default&quot;:&quot;HOME&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'HOME';
    return { items: ['HOME','ABOUT','SERVICES','BLOG','CONTACT'].map(l => ({ label: l, current: l === a ? 'true' : undefined, line: l === a ? 'var(--color-accent)' : 'transparent' })) };
  }
}
</script>
</body>
</html>
