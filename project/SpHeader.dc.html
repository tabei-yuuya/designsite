<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>:root{--color-bg:#0F1012;--color-surface:#1A1B1D;--color-text:#F2F2F0;--color-border:rgba(255,255,255,0.16);--color-accent:#A6D43A;--font-en:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif}</style></helmet>
<header style="height:72px;padding:0 12px 0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text)">
  <a href="#" style="display:flex;align-items:center;gap:8px;font:400 17px/1 var(--font-en);color:var(--color-text);text-decoration:none">yuyadesign<span style="width:6px;height:6px;border-radius:50%;background:var(--color-accent)"></span></a>
  <button aria-expanded="false" aria-label="メニューを開く" style="width:48px;height:48px;border:none;border-radius:4px;background:var(--color-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer">
    <span style="width:20px;height:1px;background:var(--color-text)"></span><span style="width:20px;height:1px;background:var(--color-text)"></span>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:72}}"></script>
</body>
</html>
