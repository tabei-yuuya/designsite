<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>:root{--color-bg:#0F1012;--color-text:#F2F2F0;--color-text-muted:#9C9C9A;--color-border:rgba(255,255,255,0.16);--font-ja:"Noto Sans JP","Hiragino Sans",sans-serif;--font-en:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;--font-display:"Archivo","Helvetica Neue",sans-serif}</style></helmet>
<section style="padding:40px 56px 64px;background:var(--color-bg);color:var(--color-text);border-bottom:1px solid var(--color-border);display:flex;flex-direction:column;gap:96px">
  <div style="display:flex;justify-content:space-between;font:400 12px/1 var(--font-en);letter-spacing:.12em;color:var(--color-text-muted)">
    <span>{{ crumb }}</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:48px">
    <div aria-hidden="true" style="font:700 144px/.85 var(--font-display);letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap">{{ en }}</div>
    <div style="display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;align-items:end">
      <h1 style="grid-column:1 / 6;margin:0;font:400 40px/1.2 var(--font-ja);letter-spacing:.04em">{{ ja }}</h1>
      <p style="grid-column:7 / 13;margin:0;max-width:560px;font:400 16px/1.9 var(--font-ja);letter-spacing:.04em;color:var(--color-text-muted);line-break:strict;text-wrap:pretty">{{ lead }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:520},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;私たちについて&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;HOME / ABOUT&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
